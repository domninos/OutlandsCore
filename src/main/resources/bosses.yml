# Boss templates for the boss creator (separate from area mobs).
#
# Each entry under `bosses` is a boss template.
# Fields:
#   type             vanilla EntityType or MythicMobs id
#   mythic           true to spawn a MythicMob
#   display-name     optional display name
#   health           max health
#   damage           attack damage
#   level            Mythic level
#   count            boss group size
#   respawn-seconds  respawn delay (0 = no respawn)
#   drops            boss drops
#   abilities        boss abilities (SLAM, VOLLEY, TELEPORT_STRIKE, HEAL, ENRAGE, TOXIC_AURA)
#   loot-table       optional loot table id
#   loot-rolls       how many loot-table rolls to make

# Sample bosses - copy/edit these to fit your map.
bosses:
  bone_hyperion:
    type: SKELETON
    mythic: false
    display-name: "<yellow>Bone Hyperion</yellow>"
    health: 60
    damage: 6
    level: 2
    count: 1
    respawn-seconds: 0
    equipment:
      helmet: IRON_HELMET
      mainhand: BOW
    drops:
      - type: BONE
        chance: 1.0
        amount: 2
      - type: IRON_INGOT
        chance: 0.25
        amount: 1
    abilities:
      - type: SLAM
        cooldown: 12
        power: 6
        radius: 4
      - type: VOLLEY
        cooldown: 8
        power: 4
        radius: 20
        amount: 5
    loot-table: Easy
