# Loadout tier definitions
# Each slot defines an ordered list of upgrade tiers (index 0 = tier 0, the starting tier)
# Tiers can use:
#   material: Minecraft material name (e.g. LEATHER_HELMET)
#   external: External plugin item (e.g. "mmoitems:SWORD:FLAME_BLADE")
#   enchantments: List of enchantments to apply (e.g. [PROTECTION_1])
#   amount: Stack amount (for consumables like food/potions)
#   potion_type / level: For potion tiers
#   cost: Extraction tokens charged to upgrade INTO this tier (0 = free)
loadout:
  armor:
    helmet:
      tiers:
        - material: LEATHER_HELMET
        - material: CHAINMAIL_HELMET
          cost: 100
        - material: IRON_HELMET
          cost: 250
        - material: DIAMOND_HELMET
          cost: 500
        - material: NETHERITE_HELMET
          cost: 1000
    chestplate:
      tiers:
        - material: LEATHER_CHESTPLATE
        - material: CHAINMAIL_CHESTPLATE
          cost: 100
        - material: IRON_CHESTPLATE
          cost: 250
        - material: DIAMOND_CHESTPLATE
          cost: 500
        - material: NETHERITE_CHESTPLATE
          cost: 1000
    leggings:
      tiers:
        - material: LEATHER_LEGGINGS
        - material: CHAINMAIL_LEGGINGS
          cost: 100
        - material: IRON_LEGGINGS
          cost: 250
        - material: DIAMOND_LEGGINGS
          cost: 500
        - material: NETHERITE_LEGGINGS
          cost: 1000
    boots:
      tiers:
        - material: LEATHER_BOOTS
        - material: CHAINMAIL_BOOTS
          cost: 100
        - material: IRON_BOOTS
          cost: 250
        - material: DIAMOND_BOOTS
          cost: 500
        - material: NETHERITE_BOOTS
          cost: 1000
  weapon:
    tiers:
      - material: WOODEN_SWORD
      - material: STONE_SWORD
        cost: 100
      - material: IRON_SWORD
        cost: 250
      - material: DIAMOND_SWORD
        cost: 500
      - material: NETHERITE_SWORD
        cost: 1000
  tool:
    tiers:
      - material: WOODEN_PICKAXE
      - material: STONE_PICKAXE
        cost: 100
      - material: IRON_PICKAXE
        cost: 250
      - material: DIAMOND_PICKAXE
        cost: 500
      - material: NETHERITE_PICKAXE
        cost: 1000
  food:
    tiers:
      - material: BREAD
        amount: 5
      - material: COOKED_BEEF
        amount: 10
      - material: GOLDEN_APPLE
        amount: 3
  potions:
    tiers:
      - material: POTION
        potion_type: INSTANT_HEAL
        level: 1
      - material: POTION
        potion_type: INSTANT_HEAL
        level: 2
  charm:
    tiers: []
  artifact:
    tiers: []
  pet:
    tiers: []
  # Default tiers granted to players who have not upgraded a slot yet.
  # Keys match the loadout slot config keys. 0 = nothing.
  defaults:
    armor_helmet: 0
    armor_chestplate: 1
    armor_leggings: 0
    armor_boots: 0
    weapon: 0
    tool: 0
    food: 0
    potions: 0
    charm: 0
    artifact: 0
    pet: 0

  # Default off-hand compass. Shows in the loadout GUI's off-hand cell until the
  # player edits that cell; it is a normal, movable/savable loadout item and is
  # undroppable while the player is in a run. Set enabled: false to disable.
  compass:
    enabled: true
    material: COMPASS
    name: "<white>Extraction Compass</white>"
    lore:
      - "<gray>Points toward an active event</gray>"
      - "<gray>or the extraction spawn.</gray>"

# Loadout GUI (/extraction loadout)
# Loadout editor. The GUI mirrors the player's real inventory: the first row
# holds the armor + off-hand slots (only matching armor can be placed on the
# armor cells); the next three rows map 1:1 onto the 27 main inventory slots
# and the last row is the 9-slot hotbar (cells 36-44 -> hotbar slots 0-8).
# Whatever an item is placed in a cell, it lands in exactly that inventory
# slot on /extraction.
# The charm/artifact/pet cells and the off-hand cell (top row end) show a
# placeholder pane as their default. Charm/artifact/pet panes are MOVABLE
# markers: pick them up and place them on any other cell — the marker stays
# there (it persists) and the old cell stays blank. The off-hand pane is a
# fixed "Drop item here" drop-target that can never be picked up. Dropping a
# real item onto any pane replaces it. Panes are display-only and never enter
# the run inventory.
loadout-gui:
  title: "<gradient:#00AAFF:#55FFFF>Extraction Loadout</gradient>"
  rows: 5
  slots:
    helmet: 0
    chestplate: 1
    leggings: 2
    boots: 3
    weapon: 11
    tool: 12
    food: 14
    potions: 15
    charm: 20
    artifact: 22
    pet: 24
    offhand: 8
  # Filler for the first (armor) row cells that are not armor slots
  filler:
    material: GRAY_STAINED_GLASS_PANE
    name: " "
