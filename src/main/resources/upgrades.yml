# Upgrade GUI (/upgrade)
# Shows the player's current armor and lets them drop an upgrade token onto a piece.
upgrade-gui:
  title: "<gradient:#00AAFF:#55FFFF>Upgrade Loadout</gradient>"
  rows: 3
  slots:
    helmet: 10
    chestplate: 11
    leggings: 12
    boots: 13
    weapon: 15
    tool: 16
  filler:
    material: BLACK_STAINED_GLASS_PANE
    name: ""

# Upgrade confirm menu (opened when clicking an upgrade slot in /upgrade)
# after buying with tokens. Yes spends the tokens and applies the next tier;
# No (or ESC) returns to /upgrade. Placeholders: %slot%, %current%, %next%, %cost%.
upgrade-confirm:
  title: "<gradient:#00AAFF:#55FFFF>Confirm Upgrade</gradient>"
  rows: 1
  prompt-material: GOLD_INGOT
  prompt-name: "<yellow>Confirm purchase of <white>%next%</white> with <white>%cost%</white> tokens?</yellow>"
  prompt-lore:
    - "<gray>Slot: <white>%slot%</white>"
    - "<gray>Current: <white>%current%</white>"
    - "<gray>Next: <green>%next%</green>"
  yes-material: LIME_DYE
  yes-name: "<green>Yes</green>"
  no-material: RED_DYE
  no-name: "<red>No</red>"
