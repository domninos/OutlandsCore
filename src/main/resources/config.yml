settings:
  # Name of the Extraction world (must exist, e.g. via Multiverse)
  world-name: outlands
  # Time limit in seconds per run (default 5 minutes = 300 seconds).
  # Set to 0 to disable the countdown entirely - runs never auto-extract.
  time-limit-seconds: 300
  # Hours between runs (cooldown). Set to 0 to disable the cooldown.
  cooldown-hours: 0
  # Whether PvP is enabled in Extraction
  pvp-enabled: false
  # Whether players automatically extract when they disconnect mid-run.
  # On their next login they are returned to the location they entered from,
  # their saved pre-run gear is restored, and loot/tokens are banked.
  return-on-disconnect: true
  # Whether entering/leaving Extraction is announced to all online players.
  # Message text lives in messages.yml under run.broadcast-entered / run.broadcast-left.
  broadcast-run-messages: true
  # Keep the extraction world locked to night (daylight cycle disabled).
  always-night: true
  # Minecraft world time to hold while always-night is enabled (18000 = midnight).
  night-time: 18000
  # Extraction (outlands) entry spawn - where /extraction enter places players.
  # Set in-game with /extraction setspawn. Falls back to the world spawn if unset.
  spawn:
    world: outlands
    x: 0.5
    y: 64.0
    z: 0.5
    yaw: 0.0
    pitch: 0.0
  # Lobby spawn. Players who join without an in-progress run are teleported
  # here. This is a separate world; the folder must already exist and be
  # loaded on the server. Set the exact point in-game with /extraction setlobby.
  # When no point is configured the lobby world's own spawn is used (never the
  # extraction world).
  lobby:
    world: ExtractionSpawn
    # x: 0.5
    # y: 64.0
    # z: 0.5
    # yaw: 0.0
    # pitch: 0.0

# Chat prefix shown before plugin messages (configurable)
messages:
  # Shown before every plugin message in chat and in the console after startup.
  # Supports MiniMessage tags on Paper; falls back to legacy color codes on Spigot.
  # Set to "" (empty) to show messages without a prefix.
  prefix: "<gradient:#2C2C2C:#555555:#AAAAAA>ᴇxᴛʀᴀᴄᴛɪᴏɴ</gradient> <white>»</white> "

# Player data persistence
storage:
  # How often (in seconds) dirty player data is flushed to the database.
  # Data is also saved on player quit and on shutdown.
  auto-save-seconds: 30
  # Write-behind queue: changes are buffered in memory and flushed to the
  # database once this many changes have accumulated - even before the
  # auto-save interval. Set to 0 to only flush on the interval, quit and
  # shutdown (still never on the main thread). Cross-server-sensitive data
  # (tokens, cooldowns, purchases) and run/quit state always write
  # immediately and do not count toward this queue.
  save-queue-size: 10
  # Size of the dedicated off-thread worker pool that runs ALL database
  # operations (loads, saves, party lookups). Never increases the Bukkit main
  # thread's workload; raise it for busy MySQL servers.
  threads: 3
  # Maximum number of player rows written per transaction. Dirty player data is
  # coalesced (one write per player per flush) and then batched into transactions
  # of this size. Set to 0 for unlimited (not recommended for very large servers).
  batch-size: 100
  # Log every individual player load/save at INFO (very chatty on busy servers).
  # Leave false to log those at FINE; WARNING/SEVERE are always logged.
  debug: false
  # SQLite stores its journal in WAL mode: the data folder also contains
  # extraction.db-wal and extraction.db-shm, so include them in backups (or stop
  # the server before copying the .db file).
  # Backend: "sqlite" (single-server, no setup) or "mysql"
  # (MariaDB/MySQL). Use "mysql" to share data across servers behind a proxy
  # (required for cross-server parties).
  type: mysql
  # MariaDB/MySQL connection, used when type = mysql.
  mysql:
    host: localhost
    port: 3306
    database: extraction
    username: root
    password: "root"
    # Optional prefix prepended to every table name.
    table-prefix: ""
    # Encrypt the connection with TLS. Strongly recommended: it avoids the
    # MySQL 8 "RSA public key is not available" auth error (the password is
    # sent over the encrypted channel instead). Uses sslMode=trust, which
    # accepts self-signed server certificates (no hostname/CA verification).
    use-ssl: true
    pool-size: 5
    # If MySQL/MariaDB is unreachable when the server starts, run on the local
    # SQLite file instead of disabling the plugin. Data written during the
    # outage is LOCAL ONLY and is not synced back to MySQL - fix the mysql
    # settings and restart to resume shared storage.
    fallback-to-sqlite: true

# Extraction reward settings
extraction:
  # Base tokens earned on successful extraction
  base-tokens: 10
  # Bonus tokens per mob kill
  per-kill: 2
  # Bonus tokens per event completion
  per-event: 5
  # Bonus tokens per boss kill
  per-boss: 20

# Backpack (physical item, purchasable with tokens via /extraction shop or /extshop)
# The backpack is a real item in your inventory: contents live on the item itself.
# Right-click (air) while in a run to open it as a GUI; right-click (air) outside
# a run to unpack its contents into your inventory. It drops if you die in a run.
backpack:
  # Display name of the backpack item (%player% = the player who bought it)
  name: "%player%'s Backpack"
  # Item material used for a newly bought backpack
  material: CHEST
  # Content slots per backpack tier (index 0 = Tier 1)
  tier-slots: [9, 18, 27, 36]
  # Token price of each backpack tier (aligned with tier-slots)
  prices: [500, 1000, 2000, 3000]
  # Price of a single pagination upgrade
  pagination-price: 750
  # How many extra pages one pagination upgrade adds
  pagination-extra-pages: 2
  # Maximum total pages a backpack can reach
  pagination-max-pages: 4

# The /extraction shop GUI (buys backpack tiers and pagination)
shop-gui:
  title: "<gradient:#00AAFF:#55FFFF>Extraction Shop</gradient>"
  rows: 3

# Actionbar HUD
# Replaces the sidebar scoreboard as the default in-game HUD: shows the run
# timer while in a run and the cooldown while on extract cooldown. Killing a
# mob/boss during a run also flashes "+{tokens} tokens" over the timer.
actionbar:
  enabled: true
  # How often (in ticks) the actionbar refreshes (20 ticks = 1 second)
  update-ticks: 20
  # How long (in ticks) the "+N tokens" feedback stays on a mob/boss kill
  kill-feedback-ticks: 40

# Area holograms (DecentHolograms)
# Place a hologram at a fixed position per area showing its mob/boss info.
# Position is set in-game: /extraction admin addhologram {area} (at your feet),
# /extraction admin sethologram {area} (at your eye level), or removed with
# /extraction admin delhologram {area}. The hologram stays visible once
# placed. During an active clear %mobs%/%bosses% show the REMAINING counts
# (like the boss bar); when the area is idle they show the configured totals.
# %level% is the highest configured mob level of the area. Requires the
# DecentHolograms plugin on the server.
holograms:
  enabled: true
  # How often (in ticks) the hologram lines refresh (20 ticks = 1 second)
  update-ticks: 20
  lines:
    - "<yellow><bold>%area%</bold></yellow>"
    - "<gray>Level <white>%level%</white></gray>"
    - "<gray>Mobs: <white>%mobs%/%total%</white></gray>"
    - "<gold>Bosses: <white>%bosses%</white></gold>"

# Sidebar scoreboard
# Disabled by default. The actionbar HUD above is the default. Set enabled:
# true to show the sidebar instead (or alongside). Lines support MiniMessage
# and PlaceholderAPI placeholders. When PlaceholderAPI is installed, any of its
# placeholders work; otherwise the built-in %extraction_*% placeholders below are used.
#
# I used https://smallcaps.app for the font :D
scoreboard:
  enabled: false
  # Only show the scoreboard while the player is in the Extraction world
  only-in-world: true
  # How often (in ticks) the scoreboard refreshes (20 ticks = 1 second)
  update-ticks: 20
  title: 𝐄𝐗𝐓𝐑𝐀𝐂𝐓𝐈𝐎𝐍
  # Maximum of 15 lines (client limit)
  lines:
    - ''
    - <gray>ᴀʀᴇᴀ <dark_gray>Â» <white>%extraction_area%
    - ''
    - <gray>ᴛɪᴍᴇ <dark_gray>Â» <white>%extraction_timer%
    - ''
    - <gray>ᴋɪʟʟ <dark_gray>Â» <white>%extraction_kills%
    - ''
    - <gray>ᴛᴏᴋᴇɴ <dark_gray>Â» <white>%extraction_tokens%
    - ''
    - <gray>ᴘᴀʀᴛʏ <dark_gray>Â» <white>%extraction_party%
    - ''
    - <gray>ᴄʟᴏᴄᴋ <dark_gray>Â» <white>%extraction_clock%
    - ''
    - ''
    - <white>  %extraction_ip%
  # Value of %extraction_area% when the player is not inside an area
  no-area-text: ᴡɪʟᴅᴇʀɴᴇꜱꜱ
  # Value of %extraction_party% when the player is not in a party
  # (in a party it shows the leader's name).
  party-placeholder: ɴᴏɴᴇ
  # Value of %extraction_timer% when the player has no run and no cooldown
  idle-text: ɪᴅʟᴇ
  # Value of %extraction_ip%
  server-ip: ᴘʟᴀʏ.ʏᴀᴍᴄꜱ.ɴᴇᴛ
  # Timezone used by %extraction_clock% (e.g. UTC, Europe/London, America/New_York)
  time-zone: GMT-6
  # Clock format used by %extraction_clock%
  time-format: HH:mm:ss

# Loot chest defaults (used by loot_tables.yml)
loot:
  # Rolls per chest when neither the area file (loot.items-per-chest) nor the
  # loot table (items-per-chest) specifies a value
  default-items-per-chest: 3
  # Refill period for /extchest standalone loot chests (seconds) when their
  # inventory has been fully looted
  standalone-refill-seconds: 300
  # Material/display name of the physical TOKENS loot item (credits balance on pickup)
  token-item-material: GOLD_INGOT
  token-item-name: "<gold>Extraction Token</gold>"
  # Holograms shown above configured loot-chest locations (DecentHolograms),
  # one hologram per chest location. The section picks the text by state:
  #   ongoing - a clear is in progress in that area (loot cannot be claimed)
  #   ready   - the chest holds claimable loot; a loot table's own "hologram:"
  #             section (loot_tables.yml) overrides this for chests using it
  #   empty   - the owner already claimed this chest's loot
  # Lines use MiniMessage (converted to DecentHolograms colors); %area% is the
  # area name (standalone /extchest holograms use "Loot" and also support
  # %table% / %key%). Set a state to [] to hide the hologram in that state.
  chest-hologram:
    ongoing:
      - "<red><bold>AREA ONGOING</bold></red>"
    ready:
      - "<green><bold>OPEN LOOT</bold></green>"
    empty:
      - "<gray>EMPTY</gray>"

# Container block materials accepted as loot chest locations by the CHEST-mode
# wand (Material names, case-insensitive; e.g. CHEST, BARREL, ANVIL). The wand
# only opens the loot-table picker when the left-clicked block matches this list.
# The same list drives the hardcoded AreaChestLocation.isSupported set, i.e.
# which pre-placed world containers are preserved/refilled during a clear (any
# other block in a chest spot is replaced). Entries should be real inventory
# containers. A "SHULKER_BOX" entry matches every "<color>_SHULKER_BOX" variant.
containers:
  - CHEST
  - TRAPPED_CHEST
  - BARREL
  - DISPENSER
  - DROPPER
  - HOPPER
  - FURNACE
  - BLAST_FURNACE
  - SMOKER
  - SHULKER_BOX

# Resource pack per-GUI texture glyphs (custom font atlas).
# Each open GUI tiles its panel with the matching bitmap texture in
# ExtractionPack.zip. REQUIREMENTS on the client: the pack must actually apply
# (a reachable pack.host below), the player's Options > Language > Force Unicode
# Font must be OFF (it blanks every custom font glyph), and the texture PNGs must
# be 256px or smaller on both sides (vanilla font-image cap). Font images live at
# assets/minecraft/textures/gui/gui_<key>.png and are bound to their codepoint in
# a FULLY MERGED assets/minecraft/font/default.json (vanilla providers + ours).
# Titles fall back to plain text when the pack isn't hosted.
pack:
  # Host the pack from. Best left empty on a local/LAN test if the client can
  # reach the machine; otherwise set your public IP or domain, e.g. play.example.com.
  # Resolution order: this value > server.properties server-ip. If neither is a
  # usable address the pack is NOT offered (plain text titles) and a warning is
  # logged. The pack is never silently served at localhost (unreachable for
  # remote clients).
  host: ""
  # Minecraft caches a server resource pack by the UUID you offer it with. Leave
  # this empty (recommended) to derive the UUID from the zip's content hash, so
  # clients are automatically re-offered (and re-download) whenever the pack
  # changes. Set a 36-char UUID here to pin a stable id.
  # Edit it to force a one-time re-offer without touching the pack.
  id: ""
  gui-textures:
    pack-menu: "\uE001"
    loadout: "\uE002"
    upgrade: "\uE003"
    upgrade-confirm: "\uE004"
    relics-charms: "\uE005"
    relics-artifacts: "\uE006"
    backpack: "\uE007"
    backpack-shop: "\uE008"
    area-editor: "\uE009"
    loot-editor: "\uE00A"

# Loot Table Editor GUI (opened by right-clicking a container with the areas
# wand in chest/loot mode). Entries dumped into the GUI are saved as a table in
# loot_tables.yml.
loot-editor:
  title: "<gradient:#FFAA00:#FFD700>Loot Table Editor</gradient>"
  filler-material: GRAY_STAINED_GLASS_PANE
  filler-name: " "
  info-material: BOOK
  info-name: "<yellow>Loot Table: %table%</yellow>"
  info-lore:
    - "<gray>Drop items into the empty slots</gray>"
    - "<gray>to add loot entries.</gray>"
    - "<gray>Left-click an entry to edit it,</gray>"
    - "<gray>right-click to remove it.</gray>"
    - "<gray>Closes and saves automatically.</gray>"
  save-material: LIME_DYE
  save-name: "<green>Save & Close</green>"
  save-lore:
    - "<gray>Saves the loot table to</gray>"
    - "<gray>loot_tables.yml.</gray>"
  save-chest-material: CHEST
  save-chest-name: "<green>Save to Chest</green>"
  save-chest-lore:
    - "<gray>Applies these entries only to</gray>"
    - "<gray>this loot chest (own table).</gray>"
  remove-material: RED_WOOL
  remove-name: "<red>Remove Entry</red>"
  remove-lore:
    - "<gray>Deletes this entry and</gray>"
    - "<gray>returns to the table.</gray>"
  # Shift-click icon that restores the table's entries from the bundled
  # loot_tables.yml default. Hidden for tables with no shipped default.
  reset-material: HOPPER
  reset-name: "<red>Reset to Defaults</red>"
  reset-lore:
    - "<gray>Restores this table's entries</gray>"
    - "<gray>to the bundled loot_tables.yml default.</gray>"
    - ""
    - "<yellow>Shift-click to confirm</yellow>"
  # Lore template shown under each entry in the table view.
  entry-lore:
    - "<gray>Type: <white>%type%</white></gray>"
    - "<gray>Amount: <white>%amount%</white></gray>"
    - "<gray>Weight: <white>%weight%</white></gray>"
    - "<gray>Level: <white>%min-level%-%max-level%</white></gray>"
    - ""
    - "<yellow>Left-click to edit</yellow>"
    - "<red>Right-click to remove</red>"
  # Click increments offered on the per-entry editor page.
  increments: [1, 5, 10]
  amount-material: GOLD_INGOT
  amount-name: "<yellow>Amount: %value%</yellow>"
  weight-material: FEATHER
  weight-name: "<yellow>Weight: %value%</yellow>"
  min-level-material: EXPERIENCE_BOTTLE
  min-level-name: "<yellow>Min Level: %value%</yellow>"
  max-level-material: EXPERIENCE_BOTTLE
  max-level-name: "<yellow>Max Level: %value%</yellow>"

# Run-death corpses: a player-skinned NPC left at the death spot (FancyNpcs;
# falls back to an ArmorStand when FancyNpcs is missing).
corpse:
  enabled: true
  despawn-seconds: 60
  name-format: "<red>☠ %player%</red>"

# Drone mode (/drone). The pilot rides a visible drone body (a Bee with AI off,
# re-skin it via the resource pack's bee entity texture) that other players and
# mobs can hit; if it dies, the pilot is forcibly returned to their body.
drone:
  # Max health of the drone body.
  max-health: 40
  # Movement task period in ticks. 1 = every tick (smooth, 20Hz). Raise (e.g. 2)
  # to halve the per-drone server-thread cost at the cost of slightly chunkier
  # control; per-step distance scales automatically so the speed stays the same.
  # Read at server start - changing this needs a restart.
  update-ticks: 1

# Equipped pet follow behaviour. The pet trails behind its owner and smoothly
# walks toward the follow point; a long stray snaps it back.
pet-follow:
  # Movement task period in ticks. 4 = ~5 steps/second for a smooth follow.
  # Per-step distance scales so the pet still moves at the configured speed.
  update-ticks: 4
  # Movement speed in blocks per second.
  speed: 6.0
  # Distance (blocks) the pet may drift from its follow point before moving.
  follow-range: 2.5
  # Distance (blocks) beyond which the pet teleports to the owner instead.
  teleport-range: 20.0

# Boss Creator (/boss). Bosses are mobs.yml templates with boss: true.
# Boss stats, abilities, item drops and a bonus loot table are edited in the GUI.
bosses:
  # Ability update task period in ticks. Read on startup and /extraction reload.
  update-ticks: 10

boss-gui:
  title: "<gradient:#AA0000:#FF5555>Boss Creator</gradient>"
  rows: 6
  filler-material: GRAY_STAINED_GLASS_PANE
  filler-name: " "
  nav-back-material: ARROW
  nav-back-name: "<yellow>Back</yellow>"
  list-prev-material: SPECTRAL_ARROW
  list-prev-name: "<yellow>Previous Page</yellow>"
  list-next-material: SPECTRAL_ARROW
  list-next-name: "<yellow>Next Page</yellow>"
  create-material: NETHER_STAR
  create-name: "<green>Create a Boss</green>"
  create-lore:
    - "<gray>Create one with:</gray>"
    - "<white>/boss create {id} {entityType} [mythic]</white>"
  delete-material: BARRIER
  delete-name: "<red>Delete Boss</red>"
  delete-lore:
    - "<gray>Deletes this boss from mobs.yml.</gray>"
    - "<red>Shift-click to confirm.</red>"
  spawn-material: ZOMBIE_SPAWN_EGG
  spawn-name: "<green>Test Spawn</green>"
  spawn-lore:
    - "<gray>Spawns this boss at your feet.</gray>"
    - "<yellow>Click to spawn</yellow>"
  empty-material: GRAY_DYE
  empty-name: "<gray>No bosses yet</gray>"
  ability-add-material: LIME_DYE
  ability-add-name: "<green>Add Ability</green>"
  loot-table-material: CHEST
  loot-table-name: "<yellow>Bonus Loot Table: %table%</yellow>"
  # Click increments for stat/ability/loot editor pages.
  increments: [1, 5, 10]
  smallest: 1
# ============================================================================
# Natural (untracked) mob loot
# ============================================================================
# Any mob in the extraction world that is NOT part of an area clear, a world
# event, a pet, a drone mount, or a boss is treated as a natural mob. Instead
# of vanilla drops it rolls items from a loot table (loot_tables.yml).
natural-mobs:
  # When true, vanilla drops are replaced by the loot table roll.
  replace-drops: true
  # When false, replaced mobs grant no experience.
  keep-exp: false
  # Loot table used when a mob has no per-mob override below.
  default-loot-table: Easy
  # Rolls per death (each roll yields one entry from the table).
  loot-rolls: 1
  # Level passed to level-scaled loot tables (0 = unrestricted).
  level: 1
  # Per-mob overrides. Keys may be a mobs.yml template id or an EntityType
  # (case-insensitive). Unknown loot tables fall back to vanilla drops.
  per-mob:
    zombie: Easy
    skeleton: Easy

# ============================================================================
# Random natural mob spawner
# ============================================================================
# Periodically spawns configured mobs at random ground locations around
# players who are inside the extraction world. Set enabled: false to disable.
natural-spawner:
  enabled: true
  # How often (seconds) to attempt a spawn pass.
  check-seconds: 60
  # Attempts per pass (each attempt spawns one weighted pick).
  spawns-per-check: 2
  # Hard cap of alive spawner-spawned mobs tracked by the plugin.
  max-alive: 40
  # Horizontal spawn ring around a random eligible player (blocks).
  min-radius: 24
  max-radius: 96
  # When true, only players who ran /extraction are used as anchors.
  require-extraction-players: true
  # Weighted mob list. "mob" accepts a mobs.yml template id, an EntityType,
  # or a MythicMobs id (resolved by MobResolver).
  mobs:
    - mob: zombie
      weight: 4
      count: 2
      level: 1
    - mob: skeleton
      weight: 3
      count: 1
      level: 1
    - mob: skeleton_guard
      weight: 1
      count: 1
      level: 2

# ============================================================================
# Dropped loot beams + click pickup
# ============================================================================
# Every item dropped by a mob in the extraction world gets a light beam and
# an optional glow. In click mode, vanilla item pickup is disabled and players
# collect beams by pressing F (swap-hands) or holding right-click while aiming
# at the item.
loot-drop:
  enabled: true
  pickup:
    # click = cancel vanilla pickup and use hotkey/right-click
    # vanilla = leave normal walking-over-items pickup enabled
    mode: click
    range: 4.0
    # How far off the crosshair an item can be and still be picked.
    ray-size: 0.35
    # Minimum milliseconds between two click pickups by the same player.
    cooldown-ms: 250
    hotkey: true
    right-click: true
  tracking:
    # Hard cap of tracked drops per chunk. Drops beyond the cap stay vanilla
    # (no beam/glow/click pickup) so a hot spot cannot flood particles.
    max-per-chunk: 24
    # Hard cap of tracked drops overall.
    max-tracked: 256
  beam:
    enabled: true
    particle: END_ROD
    # Particle refresh period (1-40 ticks).
    update-ticks: 10
    height: 2.5
    spacing: 0.5
    # Hard particle budget per refresh pass across all tracked drops.
    max-particles-per-tick: 200
    # Only beam drops near players (blocks).
    view-radius: 32
  glow:
    enabled: true
    # Per-player highlight refresh period (1-40 ticks).
    update-ticks: 5