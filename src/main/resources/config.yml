settings:
  # Name of the Extraction world (must exist, e.g. via Multiverse)
  world-name: outlands
  # Time limit in seconds per run (default 5 minutes = 300 seconds).
  # Set to 0 to disable the countdown entirely — runs never auto-extract.
  time-limit-seconds: 300
  # Hours between runs (cooldown). Set to 0 to disable the cooldown.
  cooldown-hours: 24
  # Whether PvP is enabled in Extraction
  pvp-enabled: false
  # Whether players automatically extract when they disconnect mid-run.
  # On their next login they are returned to the location they entered from,
  # their saved pre-run gear is restored, and loot/tokens are banked.
  return-on-disconnect: true
  # Optional spawn location used when entering Extraction via /extraction.
  # Set in-game with /extraction setspawn. Falls back to the world spawn if unset.
  # spawn:
  #   world: outlands
  #   x: 0.5
  #   y: 64.0
  #   z: 0.5
#   yaw: 0.0
#   pitch: 0.0

# Chat prefix shown before plugin messages (configurable)
messages:
  # Shown before every plugin message in chat and in the console after startup.
  # Supports MiniMessage tags on Paper; falls back to legacy color codes on Spigot.
  # Set to "" (empty) to show messages without a prefix.
  prefix: "<gradient:#2C2C2C:#555555:#AAAAAA>Extraction</gradient> <white>»</white> "

# Player data persistence
storage:
  # How often (in seconds) dirty player data is flushed to the database.
  # Data is also saved on player quit and on shutdown.
  auto-save-seconds: 30

# Extraction reward settings
extraction:
  # Base tokens earned on successful extraction
  base-tokens: 10
  # Bonus tokens per mob kill
  per-kill: 2
  # Bonus tokens per event completion
  per-event: 5
  # Bonus tokens per boss kill
  per-boss: 20
  # Hours before unclaimed loot expires
  withdraw-expiry-hours: 24

# Loadout tier definitions
# Each slot defines an ordered list of upgrade tiers (index 0 = tier 0, the starting tier)
# Tiers can use:
#   material: Minecraft material name (e.g. LEATHER_HELMET)
#   external: External plugin item (e.g. "mmoitems:SWORD:FLAME_BLADE")
#   enchantments: List of enchantments to apply (e.g. [PROTECTION_1])
#   amount: Stack amount (for consumables like food/potions)
#   potion_type / level: For potion tiers
#   cost: Extraction tokens charged to upgrade INTO this tier (0 = free)
loadout:
  armor:
    helmet:
      tiers:
        - material: LEATHER_HELMET
        - material: CHAINMAIL_HELMET
          cost: 100
        - material: IRON_HELMET
          cost: 250
        - material: DIAMOND_HELMET
          cost: 500
        - material: NETHERITE_HELMET
          cost: 1000
    chestplate:
      tiers:
        - material: LEATHER_CHESTPLATE
        - material: CHAINMAIL_CHESTPLATE
          cost: 100
        - material: IRON_CHESTPLATE
          cost: 250
        - material: DIAMOND_CHESTPLATE
          cost: 500
        - material: NETHERITE_CHESTPLATE
          cost: 1000
    leggings:
      tiers:
        - material: LEATHER_LEGGINGS
        - material: CHAINMAIL_LEGGINGS
          cost: 100
        - material: IRON_LEGGINGS
          cost: 250
        - material: DIAMOND_LEGGINGS
          cost: 500
        - material: NETHERITE_LEGGINGS
          cost: 1000
    boots:
      tiers:
        - material: LEATHER_BOOTS
        - material: CHAINMAIL_BOOTS
          cost: 100
        - material: IRON_BOOTS
          cost: 250
        - material: DIAMOND_BOOTS
          cost: 500
        - material: NETHERITE_BOOTS
          cost: 1000
  weapon:
    tiers:
      - material: WOODEN_SWORD
      - material: STONE_SWORD
        cost: 100
      - material: IRON_SWORD
        cost: 250
      - material: DIAMOND_SWORD
        cost: 500
      - material: NETHERITE_SWORD
        cost: 1000
  tool:
    tiers:
      - material: WOODEN_PICKAXE
      - material: STONE_PICKAXE
        cost: 100
      - material: IRON_PICKAXE
        cost: 250
      - material: DIAMOND_PICKAXE
        cost: 500
      - material: NETHERITE_PICKAXE
        cost: 1000
  food:
    tiers:
      - material: BREAD
        amount: 5
      - material: COOKED_BEEF
        amount: 10
      - material: GOLDEN_APPLE
        amount: 3
  potions:
    tiers:
      - material: POTION
        potion_type: INSTANT_HEAL
        level: 1
      - material: POTION
        potion_type: INSTANT_HEAL
        level: 2
  charm:
    tiers: []
  artifact:
    tiers: []
  pet:
    tiers: []
  # Default tiers granted to players who have not upgraded a slot yet.
  # Keys match the loadout slot config keys. 0 = nothing.
  defaults:
    armor_helmet: 0
    armor_chestplate: 1
    armor_leggings: 0
    armor_boots: 0
    weapon: 0
    tool: 0
    food: 0
    potions: 0
    charm: 0
    artifact: 0
    pet: 0

# Upgrade Token definitions
# These are physical loot items found during runs
upgrade-tokens:
  stone_weapon:
    material: PAPER
    display-name: "<gray>Stone Weapon Upgrade</gray>"
    upgrade-slot: WEAPON
    upgrade-tier: 1
    lore:
      - "<gray>Apply to your weapon loadout"
      - "<gray>to upgrade to Stone tier."
  iron_helmet:
    material: PAPER
    display-name: "<gray>Iron Helmet Upgrade</gray>"
    upgrade-slot: HELMET
    upgrade-tier: 2
    lore:
      - "<gray>Apply to your helmet loadout"
      - "<gray>to upgrade to Iron tier."
  diamond_chestplate:
    material: PAPER
    display-name: "<gray>Diamond Chestplate Upgrade</gray>"
    upgrade-slot: CHESTPLATE
    upgrade-tier: 3
    lore:
      - "<gray>Apply to your chestplate loadout"
      - "<gray>to upgrade to Diamond tier."

# Upgrade GUI (/upgrade)
# Shows the player's current armor and lets them drop an upgrade token onto a piece.
upgrade-gui:
  title: "<gradient:#00AAFF:#55FFFF>Upgrade Loadout</gradient>"
  rows: 3
  slots:
    helmet: 10
    chestplate: 11
    leggings: 12
    boots: 13
    weapon: 15
    tool: 16
  filler:
    material: BLACK_STAINED_GLASS_PANE
    name: ""

# Loadout GUI (/extraction loadout)
# Loadout editor. The armor slots sit on the first row (only matching armor
# can be placed there); every other cell is free placement — whatever is in
# this inventory is what you get on /extraction.
loadout-gui:
  title: "<gradient:#00AAFF:#55FFFF>Extraction Loadout</gradient>"
  rows: 5
  slots:
    helmet: 0
    chestplate: 1
    leggings: 2
    boots: 3
    weapon: 11
    tool: 12
    food: 14
    potions: 15
    charm: 20
    artifact: 22
    pet: 24
    offhand: 8
  # Filler for the first (armor) row cells that are not armor slots
  filler:
    material: GRAY_STAINED_GLASS_PANE
    name: " "

# Area editing tools (/areas)
areas:
  # Pending wand edits (spawn points, chest, bounds) are flushed to disk
  # every N seconds. Set to 0 to disable the periodic save (/areas update still works).
  auto-save-seconds: 30
  # How often (in seconds) area cooldowns are checked and areas return to READY.
  # Set to 0 to disable.
  state-check-seconds: 1
  # Keep spawned area mobs inside their area by returning them to their spawn point.
  mob-containment:
    enabled: true
    # How often (in ticks) containment is checked (20 ticks = 1 second).
    check-ticks: 20
    # Extra blocks outside the area bounds mobs may wander before being returned.
    margin: 0
  # When a player enters an area that's not READY (cooldown/respawning),
  # tell them how long until it's available.
  cooldown-block:
    enabled: true
  outline:
    # How often (in ticks) the selection outline and point markers refresh
    refresh-ticks: 10
    # Maximum number of particles used to draw the selection box
    max-points: 256
    # Particle used for the selection box (DUST supports the colors below)
    particle: DUST
    # Selection box color as "r,g,b"
    color: "0,180,255"
    # Mob spawn point marker color as "r,g,b"
    color-mob: "0,255,0"
    # Boss spawn point marker color as "r,g,b"
    color-boss: "255,0,0"
    # Loot chest marker color as "r,g,b"
    color-chest: "255,215,0"
    # Radius (in blocks) used by shift + left-click to remove a spawn point
    point-remove-radius: 3

# Wand GUI editor (/areas wand)
# Left-clicking a block in SPAWN mode opens a multi-page editor to pick the mob,
# count, level, respawn time and boss flag. Left-clicking a block in CHEST mode
# opens a picker for the chest's loot table. Icons use Material names.
area-editor:
  title: "<gradient:#00AAFF:#55FFFF>Area Editor</gradient>"
  rows: 6
  filler-material: GRAY_STAINED_GLASS_PANE
  filler-name: " "
  # Navigation bar (any GUI size): back = first cell of the bottom row,
  # previous-page = center -1, question = center, next-page = center +1,
  # next-step = last cell. Example (54-slot GUI): 45 = back, 48 = previous page,
  # 49 = question, 50 = next page, 53 = next step. Clicking "back" on the first
  # step cancels.
  nav-back-material: ARROW
  nav-back-name: "<yellow>Back</yellow>"
  nav-next-material: LIME_DYE
  nav-next-name: "<green>Next</green>"
  nav-cancel-material: BARRIER
  nav-cancel-name: "<red>Cancel</red>"
  list-prev-material: ARROW
  list-prev-name: "<yellow>Previous Page</yellow>"
  list-prev-lore:
    - "<gray>Previous set of choices.</gray>"
  list-next-material: ARROW
  list-next-name: "<yellow>Next Page</yellow>"
  list-next-lore:
    - "<gray>Next set of choices.</gray>"
  # Loot table picker (CHEST mode). %name% = table display-name/id.
  chest-icon-material: CHEST
  chest-icon-name: "<white>%name%</white>"
  chest-icon-lore:
    - "<gray>Click to set this loot table</gray>"
  default-loot-name: "<green>Default (area loot)</green>"
  # Mob select (SPAWN mode). %name% = mob template id / provider / vanilla type.
  mob-icon-material: ZOMBIE_HEAD
  mob-icon-name: "<white>%name%</white>"
  # Numeric pages. The counter row shows the current value and +/- buttons for
  # each configured increment. The icon/name of a step can be overridden below.
  count-smallest: 1
  count-increments: [1, 5, 10]
  level-smallest: 1
  level-increments: [1, 5, 10]
  respawn-smallest: 0
  respawn-increments: [5, 30, 60]
  increment-icon-material: GREEN_STAINED_GLASS_PANE
  increment-icon-name: "<green>+%value%</green>"
  decrement-icon-material: RED_STAINED_GLASS_PANE
  decrement-icon-name: "<red>-%value%</red>"
  count-icon-material: GOLD_INGOT
  count-icon-name: "<yellow>Amount: %count%</yellow>"
  level-icon-material: EXPERIENCE_BOTTLE
  level-icon-name: "<yellow>Level: %value%</yellow>"
  respawn-icon-material: CLOCK
  respawn-icon-name: "<yellow>Respawn: %value% s</yellow>"
  # Boss flag page
  boss-yes-material: GREEN_WOOL
  boss-yes-name: "<green>Boss: Yes</green>"
  boss-no-material: RED_WOOL
  boss-no-name: "<red>Boss: No</red>"

# Actionbar HUD
# Replaces the sidebar scoreboard as the default in-game HUD: shows the run
# timer while in a run and the cooldown while on extract cooldown. Killing a
# mob/boss during a run also flashes "+{tokens} tokens" over the timer.
actionbar:
  enabled: true
  # How often (in ticks) the actionbar refreshes (20 ticks = 1 second)
  update-ticks: 20
  # How long (in ticks) the "+N tokens" feedback stays on a mob/boss kill
  kill-feedback-ticks: 40

# Sidebar scoreboard
# Disabled by default — the actionbar HUD above is the default. Set enabled:
# true to show the sidebar instead (or alongside). Lines support MiniMessage
# and PlaceholderAPI placeholders. When PlaceholderAPI is installed, any of its
# placeholders work; otherwise the built-in %extraction_*% placeholders below are used.
#
# I used https://smallcaps.app for the font :D
scoreboard:
  enabled: false
  # Only show the scoreboard while the player is in the Extraction world
  only-in-world: true
  # How often (in ticks) the scoreboard refreshes (20 ticks = 1 second)
  update-ticks: 20
  title: 𝐄𝐗𝐓𝐑𝐀𝐂𝐓𝐈𝐎𝐍
  # Maximum of 15 lines (client limit)
  lines:
    - ''
    - <gray>ᴀʀᴇᴀ <dark_gray>» <white>%extraction_area%
    - ''
    - <gray>ᴛɪᴍᴇ <dark_gray>» <white>%extraction_timer%
    - ''
    - <gray>ᴋɪʟʟꜱ <dark_gray>» <white>%extraction_kills%
    - ''
    - <gray>ᴛᴏᴋᴇɴꜱ <dark_gray>» <white>%extraction_tokens%
    - ''
    - <gray>ᴘᴀʀᴛʏ <dark_gray>» <white>%extraction_party%
    - ''
    - <gray>ᴄʟᴏᴄᴋ <dark_gray>» <white>%extraction_clock%
    - ''
    - ''
    - <white>  %extraction_ip%
  # Value of %extraction_area% when the player is not inside an area
  no-area-text: ᴡɪʟᴅᴇʀɴᴇꜱꜱ
  # Value of %extraction_party% (party system is not implemented yet)
  party-placeholder: ɴᴏɴᴇ
  # Value of %extraction_timer% when the player has no run and no cooldown
  idle-text: ɪᴅʟᴇ
  # Value of %extraction_ip%
  server-ip: ᴘʟᴀʏ.ʏᴀᴍᴄꜱ.ɴᴇᴛ
  # Timezone used by %extraction_clock% (e.g. UTC, Europe/London, America/New_York)
  time-zone: GMT-6
  # Clock format used by %extraction_clock%
  time-format: HH:mm:ss

# Loot chest defaults (used by loot_tables.yml)
loot:
  # Rolls per chest when neither the area file (loot.items-per-chest) nor the
  # loot table (items-per-chest) specifies a value
  default-items-per-chest: 3
  # Material/display name of the physical TOKENS loot item (credits balance on pickup)
  token-item-material: GOLD_INGOT
  token-item-name: "<gold>Extraction Token</gold>"
  # Material/display name of the TIME loot item (right-click while in a run adds time)
  time-item-material: CLOCK
  time-item-name: "<yellow>Extra Time</yellow>"
