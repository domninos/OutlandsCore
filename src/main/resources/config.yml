settings:
  # Name of the Extraction world (must exist, e.g. via Multiverse)
  world-name: outlands
  # Time limit in seconds per run (default 5 minutes = 300 seconds).
  # Set to 0 to disable the countdown entirely — runs never auto-extract.
  time-limit-seconds: 300
  # Hours between runs (cooldown). Set to 0 to disable the cooldown.
  cooldown-hours: 0
  # Whether PvP is enabled in Extraction
  pvp-enabled: false
  # Whether players automatically extract when they disconnect mid-run.
  # On their next login they are returned to the location they entered from,
  # their saved pre-run gear is restored, and loot/tokens are banked.
  return-on-disconnect: true
  # Optional spawn location used when entering Extraction via /extraction.
  # Set in-game with /extraction setspawn. Falls back to the world spawn if unset.
  # spawn:
  #   world: outlands
  #   x: 0.5
  #   y: 64.0
  #   z: 0.5
#   yaw: 0.0
#   pitch: 0.0

# Chat prefix shown before plugin messages (configurable)
messages:
  # Shown before every plugin message in chat and in the console after startup.
  # Supports MiniMessage tags on Paper; falls back to legacy color codes on Spigot.
  # Set to "" (empty) to show messages without a prefix.
  prefix: "<gradient:#2C2C2C:#555555:#AAAAAA>Extraction</gradient> <white>»</white> "

# Player data persistence
storage:
  # How often (in seconds) dirty player data is flushed to the database.
  # Data is also saved on player quit and on shutdown.
  auto-save-seconds: 30

# Extraction reward settings
extraction:
  # Base tokens earned on successful extraction
  base-tokens: 10
  # Bonus tokens per mob kill
  per-kill: 2
  # Bonus tokens per event completion
  per-event: 5
  # Bonus tokens per boss kill
  per-boss: 20

# Backpack (physical item, purchasable with tokens via /extraction shop or /extshop)
# The backpack is a real item in your inventory: contents live on the item itself.
# Right-click (air) while in a run to open it as a GUI; right-click (air) outside
# a run to unpack its contents into your inventory. It drops if you die in a run.
backpack:
  # Display name of the backpack item (%player% = the player who bought it)
  name: "%player%'s Backpack"
  # Item material used for a newly bought backpack
  material: CHEST
  # Content slots per backpack tier (index 0 = Tier 1)
  tier-slots: [9, 18, 27, 36]
  # Token price of each backpack tier (aligned with tier-slots)
  prices: [500, 1000, 2000, 3000]
  # Price of a single pagination upgrade
  pagination-price: 750
  # How many extra pages one pagination upgrade adds
  pagination-extra-pages: 2
  # Maximum total pages a backpack can reach
  pagination-max-pages: 4

# The /extraction shop GUI (buys backpack tiers and pagination)
shop-gui:
  title: "<gradient:#00AAFF:#55FFFF>Extraction Shop</gradient>"
  rows: 3

# Actionbar HUD
# Replaces the sidebar scoreboard as the default in-game HUD: shows the run
# timer while in a run and the cooldown while on extract cooldown. Killing a
# mob/boss during a run also flashes "+{tokens} tokens" over the timer.
actionbar:
  enabled: true
  # How often (in ticks) the actionbar refreshes (20 ticks = 1 second)
  update-ticks: 20
  # How long (in ticks) the "+N tokens" feedback stays on a mob/boss kill
  kill-feedback-ticks: 40

# Area holograms (DecentHolograms)
# Place a hologram at a fixed position per area showing its mob/boss info.
# Position is set in-game: /extraction admin addhologram {area} (at your feet),
# /extraction admin sethologram {area} (at your eye level), or removed with
# /extraction admin delhologram {area}. The hologram stays visible once
# placed. During an active clear %mobs%/%bosses% show the REMAINING counts
# (like the boss bar); when the area is idle they show the configured totals.
# %level% is the highest configured mob level of the area. Requires the
# DecentHolograms plugin on the server.
holograms:
  enabled: true
  # How often (in ticks) the hologram lines refresh (20 ticks = 1 second)
  update-ticks: 20
  lines:
    - "<yellow><bold>%area%</bold></yellow>"
    - "<gray>Level <white>%level%</white></gray>"
    - "<gray>Mobs: <white>%mobs%/%total%</white></gray>"
    - "<gold>Bosses: <white>%bosses%</white></gold>"

# Sidebar scoreboard
# Disabled by default — the actionbar HUD above is the default. Set enabled:
# true to show the sidebar instead (or alongside). Lines support MiniMessage
# and PlaceholderAPI placeholders. When PlaceholderAPI is installed, any of its
# placeholders work; otherwise the built-in %extraction_*% placeholders below are used.
#
# I used https://smallcaps.app for the font :D
scoreboard:
  enabled: false
  # Only show the scoreboard while the player is in the Extraction world
  only-in-world: true
  # How often (in ticks) the scoreboard refreshes (20 ticks = 1 second)
  update-ticks: 20
  title: 𝐄𝐗𝐓𝐑𝐀𝐂𝐓𝐈𝐎𝐍
  # Maximum of 15 lines (client limit)
  lines:
    - ''
    - <gray>ᴀʀᴇᴀ <dark_gray>» <white>%extraction_area%
    - ''
    - <gray>ᴛɪᴍᴇ <dark_gray>» <white>%extraction_timer%
    - ''
    - <gray>ᴋɪʟʟꜱ <dark_gray>» <white>%extraction_kills%
    - ''
    - <gray>ᴛᴏᴋᴇɴꜱ <dark_gray>» <white>%extraction_tokens%
    - ''
    - <gray>ᴘᴀʀᴛʏ <dark_gray>» <white>%extraction_party%
    - ''
    - <gray>ᴄʟᴏᴄᴋ <dark_gray>» <white>%extraction_clock%
    - ''
    - ''
    - <white>  %extraction_ip%
  # Value of %extraction_area% when the player is not inside an area
  no-area-text: ᴡɪʟᴅᴇʀɴᴇꜱꜱ
  # Value of %extraction_party% (party system is not implemented yet)
  party-placeholder: ɴᴏɴᴇ
  # Value of %extraction_timer% when the player has no run and no cooldown
  idle-text: ɪᴅʟᴇ
  # Value of %extraction_ip%
  server-ip: ᴘʟᴀʏ.ʏᴀᴍᴄꜱ.ɴᴇᴛ
  # Timezone used by %extraction_clock% (e.g. UTC, Europe/London, America/New_York)
  time-zone: GMT-6
  # Clock format used by %extraction_clock%
  time-format: HH:mm:ss

# Loot chest defaults (used by loot_tables.yml)
loot:
  # Rolls per chest when neither the area file (loot.items-per-chest) nor the
  # loot table (items-per-chest) specifies a value
  default-items-per-chest: 3
  # Material/display name of the physical TOKENS loot item (credits balance on pickup)
  token-item-material: GOLD_INGOT
  token-item-name: "<gold>Extraction Token</gold>"
  # Holograms shown above configured loot-chest locations (DecentHolograms),
  # one hologram per chest location. The section picks the text by state:
  #   ongoing - a clear is in progress in that area (loot cannot be claimed)
  #   ready   - the chest holds claimable loot; a loot table's own "hologram:"
  #             section (loot_tables.yml) overrides this for chests using it
  #   empty   - the owner already claimed this chest's loot
  # Lines use MiniMessage (converted to DecentHolograms colors); %area% is the
  # area name. Set a state to [] to hide the hologram in that state.
  chest-hologram:
    ongoing:
      - "<red><bold>AREA ONGOING</bold></red>"
    ready:
      - "<green><bold>OPEN LOOT</bold></green>"
    empty:
      - "<gray>EMPTY</gray>"

# Container block materials accepted as loot chest locations by the CHEST-mode
# wand (Material names, case-insensitive; e.g. CHEST, BARREL, ANVIL). The wand
# only opens the loot-table picker when the left-clicked block matches this list.
# The same list drives the hardcoded AreaChestLocation.isSupported set, i.e.
# which pre-placed world containers are preserved/refilled during a clear (any
# other block in a chest spot is replaced). Entries should be real inventory
# containers. A "SHULKER_BOX" entry matches every "<color>_SHULKER_BOX" variant.
containers:
  - CHEST
  - TRAPPED_CHEST
  - BARREL
  - DISPENSER
  - DROPPER
  - HOPPER
  - FURNACE
  - BLAST_FURNACE
  - SMOKER
  - SHULKER_BOX

# Resource pack per-GUI texture glyphs (custom font atlas).
# Each open GUI tiles its panel with the matching bitmap texture in
# ExtractionPack.zip. REQUIREMENTS on the client: the pack must actually apply
# (a reachable pack.host below), the player's Options > Language > Force Unicode
# Font must be OFF (it blanks every custom font glyph), and the texture PNGs must
# be 256px or smaller on both sides (vanilla font-image cap). Font images live at
# assets/minecraft/textures/gui/gui_<key>.png and are bound to their codepoint in
# a FULLY MERGED assets/minecraft/font/default.json (vanilla providers + ours).
# Titles fall back to plain text when the pack isn't hosted.
pack:
  # Host the pack from. Best left empty on a local/LAN test if the client can
  # reach the machine; otherwise set your public IP or domain, e.g. play.example.com.
  # Resolution order: this value > server.properties server-ip. If neither is a
  # usable address the pack is NOT offered (plain text titles) and a warning is
  # logged — the pack is never silently served at localhost (unreachable for
  # remote clients).
  host: ""
  # Minecraft caches a server resource pack by the UUID you offer it with. Leave
  # this empty (recommended) to derive the UUID from the zip's content hash, so
  # clients are automatically re-offered (and re-download) whenever the pack
  # changes. Set a 36-char UUID here to pin a stable id — edit it to force a
  # one-time re-offer without touching the pack.
  id: ""
  gui-textures:
    pack-menu: "\uE001"
    loadout: "\uE002"
    upgrade: "\uE003"
    upgrade-confirm: "\uE004"
    relics-charms: "\uE005"
    relics-artifacts: "\uE006"
    backpack: "\uE007"
    backpack-shop: "\uE008"
    area-editor: "\uE009"
