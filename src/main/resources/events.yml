# World Events — random dynamic events in the Extraction world.
#
# settings:
#   enabled: master switch for the auto-scheduler (admin /extraction events start still works)
#   max-concurrent: how many events can run at once
#   check-seconds: scheduler interval (minimum 5)
#   chance-per-check: 0.0-1.0 probability a check actually starts an event
#   min-gap-seconds: forced downtime between events (0 = none)
#   spawn-radius: radius around the origin where event mobs scatter
#   difficulty-step: per-level health/damage multiplier 1 + (level - 1) * step
#   per-kill-rolls: loot-table rolls awarded per killed event mob
#   boss-roll-multiplier: per-kill-rolls multiplier applied to event bosses
#   completion-rolls: loot-table rolls per in-world player when an event succeeds
#   compass: point in-world players' compasses at the event while active
#   waypoint-hologram: DecentHolograms waypoint at the event origin
#   boss-bar: boss bar while the event runs
#
# Per-event:
#   enabled, display-name, weight (0 = never auto-chosen), cooldown-seconds,
#   duration-seconds, level, loot-table
#   spawn-locations: specific world anchors; when empty the event spawns near a
#     random online player in the extraction world
#   mobs / bosses: { mob, count, level (optional -> event level), name (optional, bosses),
#     drops (optional, bosses) } — mob ids resolve from mobs.yml, a vanilla
#     EntityType, or a MythicMobs id.
#   broadcast: warning/start/end lines (%event% %location% %remaining% %total%)
#   title: start/end title (%event%)
#   sounds: start/end Sound names (e.g. entity_wither_spawn) + volume/pitch
#   boss-bar: title (%event% %remaining% %total% %location%), color, style
#   waypoint-lines: waypoint text (%event% %location% %remaining% %total%)
#
# Placeholders: %event% = display name, %location% = "world x y z",
#               %remaining%/%total% = live mob counts.

settings:
  enabled: true
  max-concurrent: 1
  check-seconds: 30
  chance-per-check: 0.5
  min-gap-seconds: 120
  spawn-radius: 10
  difficulty-step: 0.25
  per-kill-rolls: 1
  boss-roll-multiplier: 3
  completion-rolls: 3
  compass: true
  waypoint-hologram: true
  boss-bar: true

events:
  zombie_wave:
    enabled: true
    display-name: "Zombie Wave"
    weight: 20
    cooldown-seconds: 900
    duration-seconds: 300
    level: 1
    loot-table: "Easy"
    mobs:
      - mob: ZOMBIE
        count: 8
      - mob: HUSK
        count: 4
    bosses:
      - mob: ZOMBIE_VILLAGER
        count: 1
        name: "<yellow><bold>Zombie Lord</bold></yellow>"
        drops:
          - type: TOKENS
            chance: 1.0
            amount: 5
          - type: UPGRADE
            chance: 0.25
            amount: 1
    broadcast:
      warning: "<yellow>[World Event] A horde approaches %location%...</yellow>"
      start: "<red>[World Event] %event% has begun at %location%!</red>"
      end: "<green>[World Event] %event% has ended.</green>"
    title:
      title: "<red><bold>%event%</bold></red>"
      subtitle: "<gray>Defend %location%!</gray>"
      fade-in: 10
      stay: 70
      fade-out: 20
    sounds:
      start: entity_zombie_ambient
      end: entity_zombie_death
      volume: 1.0
      pitch: 1.0
    boss-bar:
      enabled: true
      title: "<red>%event%</red> <dark_gray>»</dark_gray> <white>%remaining%/%total% mobs</white>"
      color: RED
      style: PROGRESS
    waypoint-lines:
      - "<yellow><bold>%event%</bold></yellow>"
      - "<white>%remaining%/%total% mobs</white>"
      - "<gray>%location%</gray>"

  wither_ritual:
    enabled: true
    display-name: "Wither Ritual"
    weight: 5
    cooldown-seconds: 1800
    duration-seconds: 420
    level: 2
    loot-table: "Easy"
    mobs:
      - mob: WITHER_SKELETON
        count: 6
      - mob: SKELETON
        count: 6
    bosses:
      - mob: WITHER
        count: 1
        drops:
          - type: TOKENS
            chance: 1.0
            amount: 10
    broadcast:
      warning: "<dark_purple>[World Event] An ominous ritual begins somewhere...</dark_purple>"
      start: "<dark_red>[World Event] %event% has begun at %location%!</dark_red>"
      end: "<green>[World Event] %event% has ended.</green>"
    title:
      title: "<dark_red><bold>%event%</bold></dark_red>"
      subtitle: "<gray>Slay the <white>Wither</white>!</gray>"
      fade-in: 10
      stay: 70
      fade-out: 20
    sounds:
      start: entity_wither_spawn
      end: entity_wither_death
      volume: 1.0
      pitch: 1.0
    boss-bar:
      enabled: true
      title: "<dark_red>%event%</dark_red> <dark_gray>»</dark_gray> <white>%remaining%/%total% mobs</white>"
      color: PURPLE
      style: NOTCHED_6
    waypoint-lines:
      - "<dark_red><bold>%event%</bold></dark_red>"
      - "<white>%remaining%/%total% mobs</white>"
      - "<gray>%location%</gray>"