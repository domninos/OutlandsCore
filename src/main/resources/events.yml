# World Events — random dynamic events in the Extraction world.
#
# settings:
#   enabled: master switch for the auto-scheduler (admin /extraction events start still works)
#   max-concurrent: how many events can run at once
#   check-seconds: scheduler interval (minimum 5)
#   chance-per-check: 0.0-1.0 probability a check actually starts an event
#   min-gap-seconds: forced downtime between events (0 = none)
#   spawn-radius: radius around the origin where event mobs scatter
#   difficulty-step: per-level health/damage multiplier 1 + (level - 1) * step
#   per-kill-rolls: loot-table rolls awarded per killed event mob
#   boss-roll-multiplier: per-kill-rolls multiplier applied to event bosses
#   completion-rolls: loot-table rolls per in-world player when an event succeeds
#   compass: point in-world players' compasses at the event while active
#   waypoint-hologram: DecentHolograms waypoint at the event origin
#   boss-bar: boss bar while the event runs
#
# Per-event:
#   enabled, display-name, weight (0 = never auto-chosen), cooldown-seconds,
#   duration-seconds, level, loot-table, harvest-chests (N temporary chests
#   spawned at the origin when the event succeeds; right-click to claim)
#   trigger: schedule (default, global timer) or area — area-triggered events
#     are NOT on the global timer; entering ANY ready area rolls the weighted
#     chance and starts the event at that area's center. weight still drives
#     which area event wins the roll.
#   spawn-locations: specific world anchors; when empty the event spawns near a
#     random online player in the extraction world
#   mobs / bosses: { mob, count, level (optional -> event level), name (optional, bosses),
#     drops (optional, bosses) } — mob ids resolve from mobs.yml, a vanilla
#     EntityType, or a MythicMobs id.
#   reinforce-mobs: timed-only — dedicated escalation list for reinforcements
#   waves:
#     type: finite -> Horde: N time-driven escalating waves; the bosses list is
#                     spawned on boss-wave; success = everything cleared after it.
#         timed -> Meteor: the bosses list is the initial "guardian" wave;
#                  reinforcements (reinforce-mobs) spawn every interval and grow
#                  stronger; success = all guardians defeated.
#     count, interval-seconds, level-gain, count-gain, boss-wave, max (timed)
#   terrain: (meteor-crash visuals)
#     enabled, radius, depth (bowl depth, fuller toward the center)
#     floor-blocks: weighted nether/meteor floor materials (string or {type, weight})
#     edge-blocks: scorched rim materials
#     impact-effect: particle burst + explosion/crunch sound when the crater forms
#     ambient-effect: rising embers + crackle while the crater exists
#     restore-effect: burst + sound when the crater regenerates
#     push-players: push players in the crater up & backwards when it regenerates
#     push-strength, push-up
#     The crater regenerates its original terrain when all harvest chests are
#     looted, and as a safety net when the event ends or the plugin stops.
#   convoy: (supply-convoy events) the convoy spawns at its start anchor and
#     walks a sampled straight-line route toward its end anchor. Anchors are
#     OPTIONAL: unset start = event origin, unset end = the map's extraction
#     spawn (settings spawn, found via server.properties level-name). Set them
#     with /extraction events route {event} {start|end|clear|show|wand}. When
#     both anchors are set the convoy ignores the global spawn selection.
#     Interception succeeds only when the carrier AND all escorts are dead —
#     then harvest-chests spawn at the kill site; reaching the end anchor
#     (escape-radius) counts as an escape and ends the event.
#       start / end: {world, x, y, z} optional anchors (null = default route)
#       carrier: mob id (mobs.yml / vanilla / MythicMobs) driven as the boss
#       carrier-name: display name given to the carrier (MiniMessage)
#       speed: pathfinding speed 0.05-1.0
#       step-blocks: blocks between route waypoints (larger = straighter, rougher)
#       checkpoint-radius: distance to a waypoint before the next is targeted
#       stuck-seconds: no progress this long -> caravan is teleported to its waypoint
#       follow-range: escorts this far from the carrier get teleported back
#       escape-radius: carrier within this many blocks of the end anchor counts
#                      as escaped -> event ends
#       car: the visible "truck" as display entities locked to the carrier.
#         Each part: { material, dx, dy, dz, yaw }
#           material: block materials render as BlockDisplay, others as ItemDisplay
#           dx/dy/dz: offset from the carrier's FEET (negative dy = wheels/crates)
#           yaw: the part's rotation in degrees (0 = facing south, vanilla default)
#         While any car is configured the driver mob is hidden (invisible +
#         silent) and the parts are repositioned every tick so the whole truck
#         rides the carrier as it turns. ~64 parts max (keep it snappy).
#         Example: 3x3x2 truck around the driver's feet —
#           - { material: STONE_BRICKS, dx: 0, dy: 1, dz: 0 }
#           - { material: STONE_BRICKS, dx: 1, dy: 1, dz: 0 }
#           - { material: OAK_PLANKS,   dx: 0, dy: 0, dz: 1 }
#           - { material: BLACK_CONCRETE, dx: -0.5, dy: 0, dz: 0.5 }   # crate
#   storm: (toxic-storm events) drifting contaminated zones. A storm only
#     runs bound to a READY extraction area: a random area is chosen at start,
#     every zone is placed inside its bounds (drift is clamped to them), and
#     the storm aborts if no area or no zone can be placed.
#       zones: how many drifting zones (capped at 12)
#       radius: zone radius in blocks
#       drift-interval-seconds: how often each zone wanders
#       drift-radius: max blocks a zone shifts per drift (clamped to the area)
#       damage-per-second: raw damage each tick while inside (0 = none)
#       poison-level / poison-seconds: poison applied while inside
#       darkness-level / darkness-seconds: darkness applied while inside
#       blindness: also apply blindness while inside
#       mutate-multiplier: health/damage multiplier + glowing for event mobs
#                          spawned in the zones
#       mutate-prefix: name prefix added to mutated mobs (MiniMessage)
#       contamination: contaminated ground painted under every zone (saved and
#                      restored when the event ends / the last harvest chest is
#                      claimed), like the meteor crater terrain
#         enabled, depth (layers carved, thinner toward the rim)
#         floor-blocks: weighted inner materials (string or {type, weight})
#         edge-blocks: weighted rim materials
#     Storm events are timed-style: use the bosses list as the initial guardian
#     wave - TIMED success (guardians dead) spawns the harvest chests, so always
#     include bosses or the first mob kill ends the storm.
#   roam: (mini-boss / treasure-goblin events) a single roaming leader that
#     wanders the map instead of guarding a fixed point. Set type to
#     "miniboss" or "goblin" and the matching sub-section. The leader spawns
#     from the FIRST entry of bosses (else mobs) with count 1 (glowing,
#     persistent, boss-tracked so it drops boss loot). The leader's mob id
#     resolves as a mobs.yml template, a vanilla EntityType, OR a MythicMobs
#     id; an optional baby: true makes vanilla Ageable leaders (e.g. baby
#     zombie) a baby (ignored for MythicMobs). A roam event SUCCEEDS when the
#     leader dies; if duration-seconds runs out first (goblin escape) it ends
#     as a failure and uses the broadcast/title/sounds escape lines. Roam
#     events have NO waypoint hologram (the compass still points at the leader).
#       type: miniboss | goblin
#       miniboss: (when type = miniboss)
#         wander-radius: how far it roams from the origin while idle
#         aggro-range: detects players within this many blocks
#         attack-radius: periodic AoE hit radius (blocks)
#         attack-interval-seconds: seconds between AoE hits
#         attack-damage: raw AoE damage per hit
#         speed: pathfinding speed 0.05-1.0
#         phases: hp-threshold enrage steps, ordered high->low by at (0-1 = hp
#           fraction). Each: { at, damage-multiplier, speed-multiplier,
#           burst (particle puff), minions: [ {mob, count, level, ..} ] }
#       goblin: (when type = goblin)
#         flee-range: runs this far from the nearest player
#         teleport-interval-seconds: seconds between escape blinks
#         teleport-range: max blink distance
#         drop-interval-seconds: drops loot-table rolls while it runs
#         fight-threshold: damage taken that flips it to fighting
#         fight-seconds: how long it fights before fleeing again
#         speed: pathfinding speed 0.05-1.0 (fight mode; fleeing always uses 1.0
#           and leaves a golden HAPPY_VILLAGER trail)
#   bosses/mobs entries also accept: baby (vanilla Ageable only)
#   broadcast: warning/start/wave/phase/escape/end lines (%event% %location%
#     %remaining% %total% %wave% %waves% %progress% %zones% %health% %mode%)
#   title: title/subtitle/wave/phase/escape (%event% %wave% %waves%)
#   sounds: start/wave/phase/escape/end Sound names (e.g. entity_wither_spawn)
#     + volume/pitch
#   boss-bar: title (>%event% %remaining%/%total% %wave%/%waves% %location%),
#     color, style
#   waypoint-lines: waypoint text (%event% %location% %remaining% %total% %wave%
#     %waves% %progress% %zones% %health% %mode%)
#
# Placeholders: %event% = display name, %location% = "world x y z",
#               %remaining%/%total% = live mob counts, %wave%/%waves% = wave counter,
#               %progress% = convoy travel progress (0-100), %zones% = active storm zones,
#               %health% = roaming leader hp (0-100), %mode% = goblin Fleeing/Fighting
#               (or miniboss Roaming/Enraged).
#
# Convoy anchors + the car are set per-event inside the event's convoy section
# (see the supply_convoy sample below); the running route ("start"/"end" as
# world coords) is edited live with /extraction events route...

settings:
  enabled: true
  max-concurrent: 1
  check-seconds: 30
  chance-per-check: 0.5
  min-gap-seconds: 120
  spawn-radius: 10
  difficulty-step: 0.25
  per-kill-rolls: 1
  boss-roll-multiplier: 3
  completion-rolls: 3
  compass: true
  waypoint-hologram: true
  boss-bar: true

events:
  meteor_crash:
    enabled: true
    display-name: "Meteor Crash"
    weight: 15
    cooldown-seconds: 1500
    duration-seconds: 420
    level: 2
    loot-table: "meteor_crash"
    harvest-chests: 4
    # Meteor terrain: carve a nether crater at the crash site; it regenerates
    # when all harvest chests are looted (players inside are pushed up/back).
    terrain:
      enabled: true
      radius: 6
      depth: 3
      floor-blocks:
        - MAGMA_BLOCK
        - { type: BLACKSTONE, weight: 3 }
        - { type: BASALT, weight: 3 }
        - { type: NETHERRACK, weight: 2 }
      edge-blocks:
        - BLACKSTONE
        - BASALT
      impact-effect: true
      ambient-effect: true
      restore-effect: true
      push-players: true
      push-strength: 1.6
      push-up: 0.6
    # Elite guardians guard the crater; reinforcements escalate over time.
    bosses:
      - mob: IRON_GOLEM
        count: 3
        name: "<yellow><bold>Meteor Guardian</bold></yellow>"
        drops:
          - type: "EVENT:meteor_fragment"
            chance: 1.0
            amount: 1
          - type: TOKENS
            chance: 1.0
            amount: 4
    reinforce-mobs:
      - mob: ZOMBIFIED_PIGLIN
        count: 3
      - mob: BLAZE
        count: 2
      - mob: MAGMA_CUBE
        count: 2
    waves:
      type: timed
      interval-seconds: 20
      level-gain: 1
      count-gain: 1
      max: 6
    broadcast:
      warning: "<yellow>A meteor tears across the sky above %location%!</yellow>"
      start: "<red>%event% has begun at %location% — slay the guardians, then harvest the crater!</red>"
      wave: "<gold>%event%: more creatures crawl out of the crater at %location%!</gold>"
      end: "<green>%event% is over — the crater has cooled.</green>"
    title:
      title: "<red><bold>%event%</bold></red>"
      subtitle: "<gray>Slay the guardians, then harvest the crater.</gray>"
      wave: "<gold><bold>Reinforcements!</bold></gold>"
      fade-in: 10
      stay: 70
      fade-out: 20
    sounds:
      start: entity_generic_explode
      wave: entity_blaze_ambient
      end: entity_generic_explode
      volume: 1.0
      pitch: 1.0
    boss-bar:
      enabled: true
      title: "<red>%event%</red> <dark_gray>»</dark_gray> <white>%remaining%/%total%</white> <dark_gray>»</dark_gray> <gold>wave %wave%/%waves%</gold>"
      color: RED
      style: PROGRESS
    waypoint-lines:
      - "<yellow><bold>%event%</bold></yellow>"
      - "<gold>Wave %wave%/%waves%</gold>"
      - "<gray>%remaining%/%total% mobs</gray>"

  horde:
    enabled: true
    display-name: "Horde"
    # Triggered by entering any ready area: the weighted roll picks the winner
    # and the horde starts at that area's center (no single-area binding).
    trigger: area
    weight: 18
    cooldown-seconds: 1200
    duration-seconds: 420
    level: 1
    loot-table: "horde"
    mobs:
      - mob: ZOMBIE
        count: 6
      - mob: HUSK
        count: 3
      - mob: SKELETON
        count: 3
    bosses:
      - mob: ZOMBIE_VILLAGER
        count: 1
        name: "<red><bold>Horde Warlord</bold></red>"
        drops:
          - type: "KEY:golden_key"
            chance: 1.0
            amount: 1
          - type: UPGRADE
            chance: 0.5
            amount: 1
    waves:
      type: finite
      count: 8
      interval-seconds: 25
      level-gain: 1
      count-gain: 2
      boss-wave: 8
    broadcast:
      warning: "<dark_red>A horde awakens near %location%!</dark_red>"
      start: "<red>%event% has begun near %location% — survive %waves% waves!</red>"
      wave: "<dark_red>Wave %wave%/%waves% is upon you!</dark_red>"
      end: "<green>%event% has been cleared!</green>"
    title:
      title: "<dark_red><bold>%event%</bold></dark_red>"
      subtitle: "<gray>Survive %waves% waves!</gray>"
      wave: "<dark_red><bold>Wave %wave%/%waves%</bold></dark_red>"
      fade-in: 10
      stay: 70
      fade-out: 20
    sounds:
      start: entity_zombie_ambient
      wave: entity_zombie_ambient
      end: entity_ravager_roar
      volume: 1.0
      pitch: 1.0
    boss-bar:
      enabled: true
      title: "<red>%event%</red> <dark_gray>»</dark_gray> <white>wave %wave%/%waves%</white> <dark_gray>»</dark_gray> <white>%remaining% mobs</white>"
      color: RED
      style: PROGRESS
    waypoint-lines:
      - "<red><bold>%event%</bold></red>"
      - "<gold>Wave %wave%/%waves%</gold>"
      - "<gray>%remaining%/%total% mobs</gray>"

  supply_convoy:
    enabled: true
    display-name: "Supply Convoy"
    weight: 12
    cooldown-seconds: 1500
    duration-seconds: 600
    level: 2
    loot-table: "supply_convoy"
    harvest-chests: 3
    # The convoy marches a straight line from its start anchor (unset = event
    # origin) toward its end anchor (unset = the map's extraction spawn); kill
    # the carrier AND every escort before it escapes to loot the crates. The
    # anchors below are just examples — /extraction events route edits them live.
    convoy:
      carrier: "MULE"
      carrier-name: "<gold><bold>Supply Convoy</bold></gold>"
      speed: 0.3
      step-blocks: 8
      checkpoint-radius: 3
      stuck-seconds: 10
      follow-range: 12
      escape-radius: 5
      # Optional anchors (comment these out for the default route):
      # start: { world: "outlands", x: 100, y: 64, z: 100 }
      # end:   { world: "outlands", x: 0,   y: 64, z: 0 }
      # Optional display-entity "truck" parts locked to the carrier (which is
      # hidden while any part is configured). dx/dy/dz are offsets from the
      # carrier's feet; yaw rotates the part (0 = facing south). Remove the
      # whole car section to show the bare MULE again.
      car:
        # 4 wheels (body pokes past the 2-wide box)
        - { material: BLACK_CONCRETE, dx: -0.85, dy: 0.35, dz: -1.0, yaw: 0 }
        - { material: BLACK_CONCRETE, dx:  0.85, dy: 0.35, dz: -1.0, yaw: 0 }
        - { material: BLACK_CONCRETE, dx: -0.85, dy: 0.35, dz:  1.0, yaw: 0 }
        - { material: BLACK_CONCRETE, dx:  0.85, dy: 0.35, dz:  1.0, yaw: 0 }
        # Lower body (solid white)
        - { material: WHITE_CONCRETE, dx: -0.5, dy: 1.15, dz: -1.5 }
        - { material: WHITE_CONCRETE, dx:  0.0, dy: 1.15, dz: -1.5 }
        - { material: WHITE_CONCRETE, dx:  0.5, dy: 1.15, dz: -1.5 }
        - { material: WHITE_CONCRETE, dx: -0.5, dy: 1.15, dz: -0.5 }
        - { material: WHITE_CONCRETE, dx:  0.0, dy: 1.15, dz: -0.5 }
        - { material: WHITE_CONCRETE, dx:  0.5, dy: 1.15, dz: -0.5 }
        - { material: WHITE_CONCRETE, dx: -0.5, dy: 1.15, dz:  0.5 }
        - { material: WHITE_CONCRETE, dx:  0.0, dy: 1.15, dz:  0.5 }
        - { material: WHITE_CONCRETE, dx:  0.5, dy: 1.15, dz:  0.5 }
        # Mid body — windshield on the front face
        - { material: WHITE_CONCRETE, dx: -0.5, dy: 1.65, dz: -1.5 }
        - { material: WHITE_CONCRETE, dx:  0.0, dy: 1.65, dz: -1.5 }
        - { material: WHITE_CONCRETE, dx:  0.5, dy: 1.65, dz: -1.5 }
        - { material: WHITE_CONCRETE, dx: -0.5, dy: 1.65, dz: -0.5 }
        - { material: WHITE_CONCRETE, dx:  0.0, dy: 1.65, dz: -0.5 }
        - { material: WHITE_CONCRETE, dx:  0.5, dy: 1.65, dz: -0.5 }
        - { material: WHITE_CONCRETE, dx: -0.5, dy: 1.65, dz:  0.5 }
        - { material: GLASS,          dx:  0.0, dy: 1.65, dz:  0.5 }   # windshield
        - { material: WHITE_CONCRETE, dx:  0.5, dy: 1.65, dz:  0.5 }
        - { material: WHITE_CONCRETE, dx: -0.5, dy: 1.65, dz:  1.5 }
        - { material: WHITE_CONCRETE, dx:  0.0, dy: 1.65, dz:  1.5 }
        - { material: WHITE_CONCRETE, dx:  0.5, dy: 1.65, dz:  1.5 }
        # Upper body — side windows
        - { material: WHITE_CONCRETE, dx: -0.5, dy: 2.15, dz: -1.5 }
        - { material: WHITE_CONCRETE, dx:  0.0, dy: 2.15, dz: -1.5 }
        - { material: WHITE_CONCRETE, dx:  0.5, dy: 2.15, dz: -1.5 }
        - { material: GLASS,          dx: -0.5, dy: 2.15, dz: -0.5 }
        - { material: WHITE_CONCRETE, dx:  0.0, dy: 2.15, dz: -0.5 }
        - { material: GLASS,          dx:  0.5, dy: 2.15, dz: -0.5 }
        - { material: WHITE_CONCRETE, dx: -0.5, dy: 2.15, dz:  0.5 }
        - { material: WHITE_CONCRETE, dx:  0.0, dy: 2.15, dz:  0.5 }
        - { material: WHITE_CONCRETE, dx:  0.5, dy: 2.15, dz:  0.5 }
        - { material: WHITE_CONCRETE, dx: -0.5, dy: 2.15, dz:  1.5 }
        - { material: WHITE_CONCRETE, dx:  0.0, dy: 2.15, dz:  1.5 }
        - { material: WHITE_CONCRETE, dx:  0.5, dy: 2.15, dz:  1.5 }
        # Roof
        - { material: WHITE_CONCRETE, dx: -0.5, dy: 2.65, dz: -1.5 }
        - { material: WHITE_CONCRETE, dx:  0.0, dy: 2.65, dz: -1.5 }
        - { material: WHITE_CONCRETE, dx:  0.5, dy: 2.65, dz: -1.5 }
        - { material: WHITE_CONCRETE, dx: -0.5, dy: 2.65, dz: -0.5 }
        - { material: WHITE_CONCRETE, dx:  0.0, dy: 2.65, dz: -0.5 }
        - { material: WHITE_CONCRETE, dx:  0.5, dy: 2.65, dz: -0.5 }
        - { material: WHITE_CONCRETE, dx: -0.5, dy: 2.65, dz:  0.5 }
        - { material: WHITE_CONCRETE, dx:  0.0, dy: 2.65, dz:  0.5 }
        - { material: WHITE_CONCRETE, dx:  0.5, dy: 2.65, dz:  0.5 }
    mobs:
      - mob: PILLAGER
        count: 3
      - mob: VINDICATOR
        count: 2
    broadcast:
      warning: "<yellow>A heavily guarded supply convoy is moving toward the extraction point!</yellow>"
      start: "<gold>%event% is coming from %location% — stop it before it escapes!</gold>"
      wave: "<gold>%event%: %remaining% escort(s) still guard the carrier!</gold>"
      end: "<green>%event% was intercepted — claim the supply crates!</green>"
    title:
      title: "<gold><bold>%event%</bold></gold>"
      subtitle: "<gray>Stop the convoy before it reaches the extraction point.</gray>"
      wave: "<gold><bold>Escorts closing in!</bold></gold>"
      fade-in: 10
      stay: 70
      fade-out: 20
    sounds:
      start: entity_evoker_ambient
      wave: entity_pillager_ambient
      end: entity_chorus_flower_grow
      volume: 1.0
      pitch: 1.0
    boss-bar:
      enabled: true
      title: "<gold>%event%</gold> <dark_gray>»</dark_gray> <white>%remaining% guards</white> <dark_gray>»</dark_gray> <aqua>%progress%% en route</aqua>"
      color: GOLD
      style: PROGRESS
    waypoint-lines:
      - "<gold><bold>%event%</bold></gold>"
      - "<aqua>%progress%% en route</aqua>"
      - "<gray>%remaining%/%total% guards</gray>"

  toxic_storm:
    enabled: true
    display-name: "Toxic Storm"
    weight: 10
    cooldown-seconds: 1500
    duration-seconds: 420
    level: 2
    loot-table: "toxic_storm"
    harvest-chests: 3
    # Drifting contamination zones. The storm binds to a random ready
    # extraction area; survive the guardians to claim the loot. Mutated mobs
    # spawn inside the zones and scale with the waves config.
    storm:
      zones: 3
      radius: 12
      drift-interval-seconds: 45
      drift-radius: 25
      damage-per-second: 2.0
      poison-level: 1
      poison-seconds: 6
      darkness-level: 0
      darkness-seconds: 6
      blindness: true
      mutate-multiplier: 2.0
      mutate-prefix: "<dark_green>Mutated </dark_green>"
      # Contaminated ground painted under each zone (restored on event end).
      contamination:
        enabled: true
        depth: 1
        floor-blocks:
          - { type: GREEN_CONCRETE, weight: 3 }
          - { type: SLIME_BLOCK, weight: 2 }
          - { type: LIME_TERRACOTTA, weight: 2 }
          - { type: MOSS_BLOCK, weight: 2 }
        edge-blocks:
          - { type: GREEN_CONCRETE, weight: 2 }
          - { type: SLIME_BLOCK, weight: 1 }
    # Guardians are the TIMED win gate — without them the storm ends on the
    # first kill. They spawn inside the storm zones.
    bosses:
      - mob: STRAY
        count: 3
        name: "<dark_green><bold>Toxic Guardian</bold></dark_green>"
        drops:
          - type: "EVENT:hazmat_fragment"
            chance: 1.0
            amount: 1
          - type: TOKENS
            chance: 1.0
            amount: 4
    reinforce-mobs:
      - mob: ZOMBIE
        count: 3
      - mob: SPIDER
        count: 2
    waves:
      type: timed
      interval-seconds: 20
      level-gain: 1
      count-gain: 1
      max: 6
    broadcast:
      warning: "<dark_green>A toxic storm sweeps in toward %location%!</dark_green>"
      start: "<green>%event% has begun at %location% — stay out of the clouds, or risk them for loot!</green>"
      wave: "<dark_green>%event%: mutated creatures emerge from the clouds!</dark_green>"
      end: "<green>%event% has passed — %zones% contaminated zone(s) cleared.</green>"
    title:
      title: "<dark_green><bold>%event%</bold></dark_green>"
      subtitle: "<gray>Keep clear of the clouds, or brave them for better loot.</gray>"
      wave: "<dark_green><bold>Mutants!</bold></dark_green>"
      fade-in: 10
      stay: 70
      fade-out: 20
    sounds:
      start: entity_wither_spawn
      wave: entity_zombie_infect
      end: weather_thunder
      volume: 1.0
      pitch: 0.8
    boss-bar:
      enabled: true
      title: "<dark_green>%event%</dark_green> <dark_gray>»</dark_gray> <white>%remaining%/%total%</white> <dark_gray>»</dark_gray> <green>%zones% zones</green>"
      color: GREEN
      style: PROGRESS
    waypoint-lines:
