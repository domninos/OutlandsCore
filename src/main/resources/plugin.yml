name: Extraction
description: $description
version: '${version}'

main: net.omni.extraction.ExtractionPlugin
api-version: '1.21'
load: POSTWORLD

softdepend: [ PlaceholderAPI, ProtocolLib, MythicMobs, MMOItems, ItemEdit, Nexo, Vault, DecentHolograms, FancyNpcs ]

authors: [ domninos ]

# Runtime-downloaded libraries (Paper). Only needed when storage.type = mysql.
libraries:
  - org.mariadb.jdbc:mariadb-java-client:3.4.1

commands:
  extraction:
    description: Enter Extraction or manage the plugin
  extract:
    description: Extract from Extraction early
    aliases: [ext]
  areas:
    description: Manage Extraction areas
    aliases: [area]
    permission: extraction.areas
  tokens:
    description: Check your extraction token balance
  loadout:
    description: Open your character loadout
  upgrade:
    description: Open the armor upgrade menu
    aliases: [upgrades]
  extshop:
    description: Open the extraction shop
  pets:
    description: View and equip your pets
    aliases: [pet]
  charms:
    description: Open your charms menu
    aliases: [extcharms]
  artifacts:
    description: Open your artifacts menu
    aliases: [extartifacts]
  drone:
    description: Activate or return from drone mode
    aliases: [dronemode]
  boss:
    description: Create and manage extraction bosses
    aliases: [bosses]
    permission: extraction.bosses
  extchest:
    description: Manage standalone loot chests
    permission: extraction.areas

permissions:
  extraction.*:
    description: Grants all Extraction permissions
    children:
      extraction.admin: true
      extraction.play: true
      extraction.areas: true
      extraction.party: true
      extraction.bypass.cooldown: true
      extraction.bosses: true
  extraction.party:
    description: Allows using the party system
    default: true
  extraction.admin:
    description: Allows managing the Extraction plugin
    default: op
  extraction.areas:
    description: Allows managing Extraction areas
    default: op
  extraction.play:
    description: Allows entering extraction
    default: true
  extraction.drone:
    description: Allows using the drone system
    default: true
  extraction.bypass.cooldown:
    description: Bypass the run cooldown
    default: false
  extraction.bosses:
    description: Allows managing extraction bosses
    default: op
