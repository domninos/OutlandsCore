# Loot tables
# Root keys are table names, referenced from area files via:
#   loot:
#     type: Easy
# Each entry is rolled with a probability proportional to its weight (default 10).
#
# Entry types:
#   type: <MATERIAL>                 Vanilla item (e.g. IRON_INGOT)
#   type: "<provider>:<...>"         External plugin item (MMOItems/Nexo/ItemEdit),
#                                    e.g. "mmoitems:SWORD:FLAME_BLADE"
#   type: TOKENS                     Physical token item (credits balance when taken from the chest)
#   type: UPGRADE                    Random upgrade-token item (from the upgrade-tokens config)
#   type: TIME                       Extra run time (right-click while in a run; the item is
#                                    picked from the config.yml time-loot list, which sets minutes)
#   type: "KEY:<keyId>"              Chest key (optional per-chest requirement; the key is
#                                    consumed when claiming a chest that was assigned it via
#                                    /areas setchest {area} {index} key {keyId}). Definitions
#                                    live in the config.yml keys: section.
#   type: "EVENT:<id>"               World-event item (resolves via config.yml event-items)
#
# Weighted level scaling: entries can be restricted by the area's level (the
# highest configured mob level of the area) with min-level/max-level. 0 (the
# default) means unrestricted; entries whose range excludes the area's level are
# skipped by the roll.
#
# items-per-chest: rolls per chest (overrides loot.default-items-per-chest; an
# area's loot.items-per-chest overrides this)
#
# Optional icon/display-name/lore fields are used by the wand chest picker
# (SPAWN/CHEST editor). Without them the picker falls back to the
# area-editor.chest-icon-* config and this table's name.
#
# Optional hologram: list of MiniMessage lines shown above loot-chest locations
# that use this table (DecentHolograms required). This overrides loot.chest-hologram.ready
# while the chest holds claimable loot; the ongoing/empty states always come from
# the loot.chest-hologram section in config.yml.
Easy:
  items-per-chest: 5
  # Picker icon (Paper material name)
  icon: GOLDEN_APPLE
  # Display name shown in the picker (MiniMessage supported)
  display-name: "<gold>Easy</gold>"
  # Lore shown in the picker (MiniMessage supported)
  lore:
    - "<gray>Safe picks for a warm-up run.</gray>"
  # Hologram shown above loot chests that roll from this table
  hologram:
    - "<yellow><bold>Easy Loot</bold></yellow>"
    - "<gray>Open the chest below</gray>"
  entries:
    - type: IRON_INGOT
      amount: 8
      weight: 10
    - type: BREAD
      amount: 4
      weight: 10
    - type: TOKENS
      amount: 3
      weight: 5
    - type: UPGRADE
      amount: 1
      weight: 4
    - type: TIME
      amount: 1
      weight: 3
    - type: "mmoitems:SWORD:FLAME_BLADE"
      amount: 1
      weight: 1

